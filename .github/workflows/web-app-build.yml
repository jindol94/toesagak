name: Web app build and publish

on:
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-build.yml'
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://zvsbvfivsbkyozehfzjd.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YmM20-dekWm7EJGCd8zW9Q_KOjXIn2N
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Publish app into the existing GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ../docs/web-app
          rm -rf ../docs/web-app/*
          cp -R dist/. ../docs/web-app/
      - name: Commit published web app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/web-app
          if git diff --cached --quiet; then
            echo "No published assets changed."
            exit 0
          fi
          git commit -m "Deploy Toesagak web app to GitHub Pages"
          git push
