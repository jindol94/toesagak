name: Toesagak web build

on:
  push:
    branches: [feat/web-app-supabase]
    paths:
      - "web-app/**"
      - ".github/workflows/web-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "web-app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
