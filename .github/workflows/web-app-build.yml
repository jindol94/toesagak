name: Web app build

on:
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-build.yml'
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm install
      - run: npm run build
